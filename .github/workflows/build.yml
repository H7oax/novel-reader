name: Build Novel Reader EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        # 使用阿里云镜像加速，防止网络超时
        pip install -i https://mirrors.aliyun.com/pypi/simple/ PyQt5 pdfplumber python-docx ebooklib beautifulsoup4 pyinstaller

    - name: Check novel_reader.py exists
      run: |
        if not exist novel_reader.py (
          echo "ERROR: novel_reader.py not found!"
          exit 1
        ) else (
          echo "novel_reader.py found, size:"
          dir novel_reader.py
        )

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --hidden-import=ebooklib.epub --name "novel_reader" novel_reader.py
        if not exist dist\novel_reader.exe (
          echo "ERROR: Build failed, EXE not generated"
          exit 1
        )

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: NovelReader
        path: dist/novel_reader.exe
