name: Build Novel Reader EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pdfplumber python-docx ebooklib beautifulsoup4 pyinstaller

    - name: Check novel_reader.py exists (PowerShell)
      shell: powershell
      run: |
        if (Test-Path novel_reader.py) {
          Write-Host "novel_reader.py found"
          Get-Item novel_reader.py | Select-Object Name, Length
        } else {
          Write-Error "novel_reader.py NOT found!"
          exit 1
        }

    - name: Build EXE with PyInstaller
      shell: powershell
      run: |
        pyinstaller --onefile --noconsole --hidden-import=ebooklib.epub --name "novel_reader" novel_reader.py
        if (Test-Path dist\novel_reader.exe) {
          Write-Host "BUILD SUCCESS"
        } else {
          Write-Error "EXE not generated!"
          exit 1
        }

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: NovelReader-EXE
        path: dist/novel_reader.exe
