name: Build Novel Reader EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pdfplumber python-docx ebooklib beautifulsoup4 pyinstaller

    - name: Check novel_reader.py exists
      run: |
        if not exist novel_reader.py (
          echo "ERROR: novel_reader.py not found!"
          exit 1
        ) else (
          echo "novel_reader.py found, size:"
          dir novel_reader.py
        )

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --hidden-import=ebooklib.epub --name "novel_reader" novel_reader.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: NovelReader-EXE
        path: dist/novel_reader.exe
