name: Build Novel Reader EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pdfplumber python-docx ebooklib beautifulsoup4 pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --hidden-import=ebooklib.epub --name "小说阅读器" novel_reader.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v3
      with:
        name: NovelReader-EXE
        path: dist/小说阅读器.exe
